<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский en 7 jours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap&subset=cyrillic">
<style>
:root{--bg:#f3f1ee;--fg:#1d2230;--mut:#6a7080;--card:#fff;--line:#d9d6d0;--acc:#1f4fa3;--ok:#1d7a4a;--ko:#b3261e;--okb:#dff3e8;--kob:#fbe3e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141822;--fg:#eceef4;--mut:#9aa1b5;--card:#1e2433;--line:#343b4f;--acc:#7da6f0;--ok:#6fd49b;--ko:#ff8a80;--okb:#1b3a2b;--kob:#44201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141822;--fg:#eceef4;--mut:#9aa1b5;--card:#1e2433;--line:#343b4f;--acc:#7da6f0;--ok:#6fd49b;--ko:#ff8a80;--okb:#1b3a2b;--kob:#44201d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif;max-width:560px;padding:0 14px 40px}
h1{font-size:1.5rem;line-height:1.2;margin:16px 0 2px}
h2{font-size:1.1rem;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 10px;font-size:.9rem}
nav{display:flex;gap:5px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;overflow-x:auto}
nav button,.chip{flex:0 0 auto;padding:8px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:600 .85rem Georgia,serif}
nav button.on,.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.l{aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:600 1.6rem Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.l small{font:.62rem sans-serif;color:var(--mut);margin-top:4px}
.l.sel{border:2px solid var(--acc)}
.l.st{background:var(--kob)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ct{text-align:center}
.big{font:700 4rem/1 Georgia,serif}
.w{font:600 1.5rem Georgia,serif}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);font:600 .95rem Georgia,serif;margin:4px}
.btn.o{background:transparent;color:var(--acc)}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ch button{padding:14px 6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;font:600 1.15rem Georgia,serif}
.ch button.ok{background:var(--okb);border-color:var(--ok)}
.ch button.ko{background:var(--kob);border-color:var(--ko)}
.sc{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.fb{min-height:1.6em;margin-top:10px;font-weight:600}
.ans{font:700 2rem Georgia,serif;min-height:2.6rem;border-bottom:2px solid var(--acc);margin:10px 0;word-break:break-all}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.kb button{width:calc((100% - 30px)/7);min-width:38px;padding:9px 0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:600 1.1rem Georgia,serif}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
summary{font-weight:700}
details p,details li{font-size:.95rem}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin:6px 0}
td,th{border:1px solid var(--line);padding:5px;text-align:center}
.sy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.sy button{padding:8px 0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:700 1.3rem Georgia,serif}
.sy small{display:block;font:.7rem sans-serif;color:var(--mut)}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--fg);font:1rem Georgia,serif}
.note{color:var(--mut);font-size:.8rem;margin-top:14px}.bar{fill:var(--acc)}.tx{fill:var(--mut);font:11px sans-serif}
label{display:flex;gap:8px;align-items:center;font-weight:600}
.bar{fill:var(--acc)}
:root:not(#x){--bg:#f5f0e6;--fg:#1f1d1a;--mut:#7a746a;--card:#fbf8f2;--line:#d8cfbf;--acc:#6e1b28;--ok:#2f6b4f;--ko:#a12d2d;--okb:#e3eee6;--kob:#f4dfdc;color-scheme:light;background:linear-gradient(180deg,#f8f3ea,#ece4d4)}
@media (prefers-color-scheme:dark){:root:not(#x){--bg:#16130f;--fg:#efe8da;--mut:#a39a8a;--card:#1f1b16;--line:#3a342b;--acc:#d3a971;--ok:#8fcf9f;--ko:#e8958d;--okb:#1f3126;--kob:#3a211e;color-scheme:dark;background:linear-gradient(180deg,#1b1712,#100e0b)}}
:root:not(#x) body{background:transparent;font-family:Inter,system-ui,sans-serif;font-size:15px}
:root:not(#x) :is(h1,h2,summary,.big,.w,.l,.ans,.sy button,.ch button,.kb button){font-family:"Cormorant Garamond",Georgia,serif}
:root:not(#x) :is(.btn,nav button,.chip,textarea,label){font-family:Inter,system-ui,sans-serif}
:root:not(#x) h1{font-size:2.4rem;font-weight:600;letter-spacing:.005em;margin:20px 0 4px;color:var(--fg)}
:root:not(#x) h2{font-size:1.4rem;font-weight:600;color:var(--fg)}
:root:not(#x) summary{font-size:1.2rem}
:root:not(#x) nav{background:var(--bg);gap:16px;margin:0 -14px;padding:6px 14px 0;border-bottom:1px solid var(--line)}
:root:not(#x) nav button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;color:var(--mut);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
:root:not(#x) nav button.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc)}
:root:not(#x) .chip{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--fg);font-size:.8rem;font-weight:500}
:root:not(#x) .chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
:root:not(#x) :is(.card,details,textarea){background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:none}
:root:not(#x) .btn{background:var(--acc);color:var(--bg);border:1px solid var(--acc);border-radius:3px;box-shadow:none;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px}
:root:not(#x) .btn.o{background:transparent;color:var(--acc)}
:root:not(#x) .big{color:var(--acc);font-weight:600}
:root:not(#x) .w{font-size:1.7rem}
:root:not(#x) .l{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:none;font-size:1.9rem;font-weight:600}
:root:not(#x) .l.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
:root:not(#x) .l.st{background:var(--kob)}
:root:not(#x) .ch button:not(.ok):not(.ko),:root:not(#x) .kb button,:root:not(#x) .sy button{background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:1.3rem}
:root:not(#x) .ans{border-bottom:1px solid var(--fg);color:var(--fg)}
:root:not(#x) input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
:root:not(#x) td,:root:not(#x) th{border-color:var(--line)}
:root:not(#x) .tx{fill:var(--mut)}
</style>
</head>
<body>
<h1>Русский en 7 jours</h1>
<p class="sub">Alphabet, voyelles, syllabes : suis le plan jour par jour.</p>
<nav id="nav"></nav>
<main id="m"></main>
<p class="note" id="note"></p>
<script>
const D=[["А","a","арбуз","pastèque"],["Б","b","банан","banane"],["В","v","вода","eau"],["Г","g (dur)","год","année"],["Д","d","дом","maison"],["Е","yé","еда","nourriture"],["Ё","yo","ёлка","sapin"],["Ж","j (comme « jour »)","жизнь","vie"],["З","z","зима","hiver"],["И","i","игра","jeu"],["Й","y (i bref)","йогурт","yaourt"],["К","k","кот","chat"],["Л","l","лампа","lampe"],["М","m","мама","maman"],["Н","n","нос","nez"],["О","o","окно","fenêtre"],["П","p","папа","papa"],["Р","r roulé","рыба","poisson"],["С","s (toujours dur)","сок","jus"],["Т","t","торт","gâteau"],["У","ou","улица","rue"],["Ф","f","фото","photo"],["Х","kh (h expiré, comme « jota »)","хлеб","pain"],["Ц","ts","цветок","fleur"],["Ч","tch","чай","thé"],["Ш","ch (comme « chat »)","школа","école"],["Щ","chtch (ch long et doux)","щётка","brosse"],["Ъ","signe dur : aucun son, sépare deux sons","объект","objet"],["Ы","y (i dur, langue en arrière)","мы","nous"],["Ь","signe mou : adoucit la consonne","день","jour"],["Э","è","это","c’est"],["Ю","you","юг","sud"],["Я","ya","яблоко","pomme"]];
const DAYS=[["Jour 1 : premiers sons","АОКМТБДЛ","Ces lettres sonnent presque comme en français. Lis chaque lettre à voix haute, écoute le mot, puis fais le quiz."],
["Jour 2 : les faux amis","ВНРСУХЕЁ","Elles ressemblent au latin mais sonnent autrement : В=v, Н=n, Р=r, С=s, У=ou. Е et Ё commencent par un « y »."],
["Jour 3 : lettres nouvelles","ГЖЗИЙПФ","Г=g, Ж=j, З=z, И=i, Й=y bref, П=p, Ф=f. Recopie-les à la main sur papier."],
["Jour 4 : sifflantes et voyelles rares","ЦЧШЩЮЯЭЫ","Ц=ts, Ч=tch, Ш=ch, Щ=chtch. Ю=you, Я=ya, Э=è, Ы=i dur."],
["Jour 5 : voyelles dures/molles, signes","ЪЬ","Lis l’onglet Règles (voyelles, signes Ъ et Ь), puis commence les syllabes."],
["Jour 6 : syllabes et lecture","","Onglet Syllabes : toutes les consonnes avec les 10 voyelles. Lis les règles sourdes/sonores et accent. Fais le quiz Syllabes puis Lire."],
["Jour 7 : révision finale","","Quiz sur toutes les lettres, vise 90 %. Relis tes notes et tes lettres marquées ★."]];
const CS={Б:"b",В:"v",Г:"g",Д:"d",З:"z",К:"k",Л:"l",М:"m",Н:"n",П:"p",Р:"r",С:"s",Т:"t",Ф:"f",Х:"kh"};
const VD=[["а","a"],["о","o"],["у","ou"],["э","è"],["ы","y"]],VM=[["я","ia"],["ё","io"],["ю","iou"],["е","ié"],["и","i"]];
const $=s=>document.querySelector(s);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tab=0,flt=null,pool=null,sel=null,qm=0,sc={ok:0,n:0,st:0},cur=null,right="",typed="",sc1="Б";
let done=get("ru_done",[]),star=get("ru_star",[]);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=.8;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ru"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function seq(a){try{speechSynthesis.cancel();const vs=speechSynthesis.getVoices();a.forEach(([l,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=l=="ru-RU"?.8:.95;const v=vs.find(v=>v.lang&&v.lang.replace("_","-").startsWith(l.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)})}catch(e){}}
const SCR={4:[["fr-FR","Les voyelles russes vont par paires : une dure et une molle. A, o, ou, è, y sont dures. Ya, yo, you, yé, i sont molles. La voyelle molle ajoute un petit y et adoucit la consonne avant elle. Compare ces deux mots."],["ru-RU","мат. мят."],["fr-FR","Le signe mou, ь, ne se prononce pas : il adoucit la consonne, comme dans"],["ru-RU","день."],["fr-FR","Le signe dur, ъ, est rare et sépare deux sons, comme dans"],["ru-RU","объект."],["fr-FR","Écoute encore et répète à voix haute."]],5:[["fr-FR","Pour lire une syllabe, prends une consonne et ajoute une voyelle. Ba, bo, bou, bè, by sont durs. Bia, bio, biou, bié, bi sont mous. Va dans l’onglet Syllabes, touche chaque syllabe et répète. Deux règles à retenir. En fin de mot, une consonne sonore devient sourde. Par exemple"],["ru-RU","хлеб"],["fr-FR","se dit khlèp. Et la lettre o non accentuée se dit presque a. Par exemple"],["ru-RU","молоко"],["fr-FR","se dit malakó."]],6:[["fr-FR","Dernier jour. Fais le quiz sur toutes les lettres et vise quatre-vingt-dix pour cent de bonnes réponses. Marque tes lettres difficiles avec l’étoile, puis relis-les. Bravo, tu sais maintenant lire le russe."]]};
function lesson(i){const a=[["fr-FR",DAYS[i][0]+". "+DAYS[i][2]]];DAYS[i][1].split("").forEach(c=>{const d=D.find(x=>x[0]===c);a.push(["ru-RU",low(c)],["fr-FR","Son : "+d[1]+". Exemple :"],["ru-RU",d[2]],["fr-FR","qui veut dire "+d[3]+"."])});if(SCR[i])a.push(...SCR[i]);seq(a)}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const low=s=>s.toLowerCase();
const P=f=>{const a=D.filter(d=>(!pool||pool.includes(d[0]))&&f(d));return a.length?a:D.filter(f)};
function nav(){$("#nav").innerHTML=["Plan","Alphabet","Règles","Syllabes","Quiz","Progrès","Notes"].map((x,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${x}</button>`).join("")}
function go(i){tab=i;sc={ok:0,n:0,st:0};nav();window.scrollTo(0,0);[plan,alpha,rules,syll,quiz,prog,notes][i]()}
// PLAN
function plan(){const n=done.length;
$("#m").innerHTML=`<p class="sub">Progression : ${n}/7 jours terminés. Environ 20 à 30 minutes par jour.</p>`+DAYS.map((d,i)=>`<div class="card"><h2>${d[0]}</h2>${d[1]?`<div class="w">${d[1].split("").map(c=>c+low(c)).join(" ")}</div>`:""}<p>${d[2]}</p>${d[1]?`<button class="btn o" onclick="flt=${i};go(1)">Voir les lettres</button>`:`<button class="btn o" onclick="go(${i==5?3:4})">${i==5?"Ouvrir les syllabes":"Ouvrir le quiz"}</button>`}<button class="btn" onclick="pool=${d[1]?`DAYS[${i}][1].split('')`:"null"};qm=0;go(4)">S’entraîner</button><button class="btn o" onclick="lesson(${i})">🔊 Écouter la leçon</button><button class="btn o" onclick="speechSynthesis.cancel()">Stop</button><label><input type="checkbox" ${done.includes(i)?"checked":""} onchange="tg(${i},this.checked)"> Jour terminé</label></div>`).join("")}
function tg(i,c){done=done.filter(x=>x!==i);if(c)done.push(i);put("ru_done",done);plan()}
// ALPHABET
function alpha(){const f=flt===null?null:DAYS[flt][1].split("");
let h=`<div class="chips"><button class="chip ${f?"":"on"}" onclick="flt=null;alpha()">Toutes</button>${[0,1,2,3,4].map(i=>`<button class="chip ${flt===i?"on":""}" onclick="flt=${i};alpha()">J${i+1}</button>`).join("")}</div>`;
h+=`<div class="card ct">${sel===null?'<p class="sub">Touche une lettre pour la voir et l’entendre.</p>':det(sel)}</div><div class="grid">`;
h+=D.map((d,i)=>f&&!f.includes(d[0])?"":`<button class="l ${i===sel?"sel":""} ${star.includes(d[0])?"st":""}" onclick="pk(${i})">${d[0]}${low(d[0])}<small>${d[1].split(" ")[0]}</small></button>`).join("")+"</div>";
$("#m").innerHTML=h}
function det(i){const d=D[i];return `<div class="big">${d[0]}${low(d[0])}</div><p><b>${d[1]}</b></p><p class="w">${d[2]}</p><p class="sub">${d[3]}</p><button class="btn" onclick="say('${d[2]}')">Le mot</button><button class="btn o" onclick="say('${low(d[0])}')">La lettre</button><button class="btn o" onclick="ts('${d[0]}')">${star.includes(d[0])?"★ Retirer":"☆ À revoir"}</button>`}
function pk(i){sel=i;alpha();say(D[i][2]);window.scrollTo(0,0)}
function ts(c){star=star.includes(c)?star.filter(x=>x!==c):[...star,c];put("ru_star",star);alpha()}
// RÈGLES
function rules(){$("#m").innerHTML=`<p class="sub">Ouvre chaque bloc. L’essentiel pour lire n’importe quel mot.</p>
<details open><summary>1. Voyelles dures et molles</summary><p>Le russe a 10 voyelles, en 5 paires. La voyelle molle = un petit « y » + la voyelle dure, et elle adoucit la consonne devant elle.</p><table><tr><th>Dure</th><th>а</th><th>о</th><th>у</th><th>э</th><th>ы</th></tr><tr><th>Molle</th><th>я</th><th>ё</th><th>ю</th><th>е</th><th>и</th></tr><tr><td>Son</td><td>a / ya</td><td>o / yo</td><td>ou / you</td><td>è / yé</td><td>y / i</td></tr></table><p>Exemples : мат (mat) vs мят (m’iat) ; тут (ici) vs тюль (tulle).</p></details>
<details><summary>2. Les signes Ь et Ъ</summary><p><b>Ь (signe mou)</b> : aucun son, il adoucit la consonne avant lui. День = d’ién. <b>Ъ (signe dur)</b> : rare, aucun son, sépare une consonne d’une voyelle molle : объект = ob-yékt.</p></details>
<details><summary>3. Consonnes sourdes et sonores</summary><table><tr><th>Sonore</th><td>Б b</td><td>В v</td><td>Г g</td><td>Д d</td><td>Ж j</td><td>З z</td></tr><tr><th>Sourde</th><td>П p</td><td>Ф f</td><td>К k</td><td>Т t</td><td>Ш ch</td><td>С s</td></tr></table><p><b>À la fin d’un mot, une sonore se prononce sourde</b> : хлеб = khlèp, год = got → « gott ». Elle s’assourdit aussi devant une sourde : в школе = f chkolè.</p></details>
<details><summary>4. Consonnes toujours dures ou molles</summary><p><b>Toujours dures</b> : Ж, Ш, Ц. <b>Toujours molles</b> : Ч, Щ, Й. Après Ж, Ш, Ц, la lettre и se lit « y » : жизнь = jyzn.</p></details>
<details><summary>5. L’accent tonique et la réduction</summary><p>Chaque mot a une syllabe accentuée (forte et longue). Les voyelles non accentuées s’affaiblissent :</p><ul><li><b>О</b> non accentué se lit presque « a » : молоко = malakó.</li><li><b>Е, Я</b> non accentués se lisent presque « i » : язык = iyzyk.</li></ul><p>Apprends donc chaque mot avec son accent. Écoute-le dans l’onglet Alphabet ou Quiz.</p></details>
<details><summary>6. Le russe se lit comme il s’écrit</summary><p>Une lettre = un son (avec les règles ci-dessus). Pas de lettres muettes sauf Ь et Ъ. Г dans « его » se lit « v » (cas particulier fréquent : его = ievo).</p></details>`}
// SYLLABES
function syll(){const c=sc1;
const row=v=>`<div class="sy">${v.map(x=>`<button onclick="say('${low(c)+x[0]}')">${low(c)+x[0]}<small>${CS[c]+x[1]}</small></button>`).join("")}</div>`;
$("#m").innerHTML=`<p class="sub">Choisis une consonne puis touche chaque syllabe pour l’entendre. Une syllabe = consonne + voyelle.</p><div class="chips">${Object.keys(CS).map(k=>`<button class="chip ${k==c?"on":""}" onclick="sc1='${k}';syll()">${k}</button>`).join("")}</div><p><b>Voyelles dures</b></p>${row(VD)}<p><b>Voyelles molles</b> (consonne adoucie)</p>${row(VM)}<p class="sub">Lis ensuite des mots : ма-ма, па-па, во-да, ко-т. Dans le quiz Syllabes, entraîne-toi à reconnaître chaque son.</p>`}
// QUIZ
function quiz(){const M=["Lire","Écouter","Écrire","Syllabes","Parler"];
$("#m").innerHTML=`<div class="chips">${M.map((x,i)=>`<button class="chip ${i==qm?"on":""}" onclick="qm=${i};sc={ok:0,n:0,st:0};quiz()">${x}</button>`).join("")}</div><p class="sub">Lettres : ${pool?pool.join(" "):"toutes"} ${pool?'<button class="chip" onclick="pool=null;quiz()">Toutes</button>':""}</p><div class="card ct" id="qq"></div>`;[read,listen,write,syl,talk][qm]()}
const scr=()=>`<div class="sc"><span>Score : ${sc.ok}/${sc.n}</span><span>Série : ${sc.st}</span></div>`;
function fin(b,g,txt){lg(g,cur&&cur[0]);sc.n++;if(g){sc.ok++;sc.st++}else sc.st=0;
document.querySelectorAll(".ch button").forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add("ok")});
if(!g)b.classList.add("ko");
$("#fb").innerHTML=(g?'<span style="color:var(--ok)">Correct !</span> ':'<span style="color:var(--ko)">Raté.</span> ')+txt+'<br><button class="btn" onclick="nx()">Suivant</button>'}
function nx(){[read,listen,write,syl,talk][qm]()}
function ans(b){fin(b,b.dataset.v===right,qm==0?`${cur[2]} = ${cur[3]}`:qm==1?`${cur[2]} (${cur[3]})`:`${cur[0]} : ${cur[1]}`);if(qm<2)say(cur[2])}
function read(){cur=pick(P(d=>d[0]!=="Ъ"));right=cur[3];
const o=shuf([cur,...shuf(D.filter(d=>d!==cur)).slice(0,3)]);
$("#qq").innerHTML=`${scr()}<p class="sub">Que signifie ce mot ?</p><div class="big" style="font-size:2.6rem">${cur[2]}</div><button class="btn o" onclick="say('${cur[2]}')">Écouter</button><div class="ch">${o.map(d=>`<button data-v="${d[3]}" onclick="ans(this)">${d[3]}</button>`).join("")}</div><div class="fb" id="fb"></div>`}
function listen(){cur=pick(P(d=>low(d[2][0])===low(d[0])));right=cur[0];
const o=shuf([cur,...shuf(D.filter(d=>d!==cur&&!["Ъ","Ь"].includes(d[0]))).slice(0,3)]);
$("#qq").innerHTML=`${scr()}<p class="sub">Écoute. Par quelle lettre commence le mot ?</p><button class="btn" onclick="say('${cur[2]}')">Réécouter</button><div class="ch">${o.map(d=>`<button data-v="${d[0]}" onclick="ans(this)">${d[0]}${low(d[0])}</button>`).join("")}</div><div class="fb" id="fb"></div>`;say(cur[2])}
function write(){cur=pick(P(d=>!["Ъ","Ы","Ь"].includes(d[0])&&d[2].length<=6));typed="";
$("#qq").innerHTML=`${scr()}<p class="sub">Écris en russe :</p><div class="w">${cur[3]}</div><button class="btn o" onclick="say('${cur[2]}')">Écouter</button><div class="ans" id="a"></div><div class="kb">${"абвгдеёжзийклмнопрстуфхцчшщъыьэюя".split("").map(c=>`<button onclick="key('${c}')">${c}</button>`).join("")}<button onclick="key('<')" style="width:30%">Effacer</button></div><button class="btn" onclick="chk()">Valider</button><div class="fb" id="fb"></div>`}
function key(c){if(document.querySelector("#fb button"))return;typed=c==="<"?typed.slice(0,-1):typed+c;$("#a").textContent=typed}
function chk(){if(!typed||document.querySelector("#fb button"))return;const g=typed===cur[2];lg(g,cur[0]);sc.n++;if(g){sc.ok++;sc.st++}else sc.st=0;
$("#fb").innerHTML=(g?'<span style="color:var(--ok)">Correct !</span> ':'<span style="color:var(--ko)">Réponse : </span>')+`<b>${cur[2]}</b><br><button class="btn" onclick="nx()">Suivant</button>`;say(cur[2])}
function syl(){const ks=Object.keys(CS).filter(k=>!pool||pool.includes(k));const c=pick(ks.length?ks:Object.keys(CS));
const all=[...VD,...VM];const v=pick(all);cur=[c,"","",""];right=CS[c]+v[1];
const o=shuf([v,...shuf(all.filter(x=>x!==v)).slice(0,3)]);
$("#qq").innerHTML=`${scr()}<p class="sub">Comment se lit cette syllabe ?</p><div class="big">${low(c)+v[0]}</div><button class="btn o" onclick="say('${low(c)+v[0]}')">Écouter</button><div class="ch">${o.map(x=>`<button data-v="${CS[c]+x[1]}" onclick="sy(this)">${CS[c]+x[1]}</button>`).join("")}</div><div class="fb" id="fb"></div>`;window.sv=low(c)+v[0]}
function sy(b){fin(b,b.dataset.v===right,`${window.sv} se lit « ${right} »`);say(window.sv)}
function lg(g,c){try{const k=new Date().toLocaleDateString("sv");const L=get("ru_log",{});L[k]=L[k]||{ok:0,n:0};L[k].n++;if(g)L[k].ok++;put("ru_log",L);if(!g&&c){const E=get("ru_err",{});E[c]=(E[c]||0)+1;put("ru_err",E)}}catch(e){}}
const nm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^а-я]/g,"");
function talk(){cur=pick(P(d=>!["Ъ","Ы","Ь"].includes(d[0])&&d[2].length<=8));$("#qq").innerHTML=`${scr()}<p class="sub">Dis ce mot à voix haute en russe :</p><div class="big" style="font-size:2.6rem">${cur[2]}</div><p class="sub">${cur[3]}</p><button class="btn o" onclick="say('${cur[2]}')">Écouter le modèle</button><button class="btn" onclick="rec()">🎤 Parler</button><div class="fb" id="fb"></div>`}
function rec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;const f=$("#fb");if(!R){f.innerHTML='Ton navigateur ne gère pas la reconnaissance vocale. Dis le mot, puis juge-toi :<br><button class="btn" onclick="self(true)">Bien dit</button><button class="btn o" onclick="self(false)">À revoir</button>';return}try{const r=new R();r.lang="ru-RU";r.maxAlternatives=5;f.textContent="Je t’écoute…";r.onresult=e=>{const a=[...e.results[0]].map(x=>x.transcript);const g=a.some(x=>nm(x)===nm(cur[2]));lg(g,cur[0]);sc.n++;if(g){sc.ok++;sc.st++}else sc.st=0;f.innerHTML=(g?'<span style="color:var(--ok)">Bien dit !</span>':'<span style="color:var(--ko)">Pas tout à fait.</span> J’ai entendu : <b>'+a[0]+'</b>. Écoute le modèle et réessaie.')+'<br><button class="btn" onclick="nx()">'+(g?"Suivant":"Passer")+'</button>'};r.onerror=e=>{f.textContent=e.error==="not-allowed"?"Autorise le micro dans ton navigateur puis réessaie.":"Rien entendu. Appuie sur Parler et réessaie."};r.start()}catch(e){f.textContent="Micro indisponible."}}
function self(g){lg(g,cur[0]);sc.n++;if(g){sc.ok++;sc.st++}else sc.st=0;$("#fb").innerHTML=(g?"Bien joué !":"On le reverra.")+'<br><button class="btn" onclick="nx()">Suivant</button>'}
function prog(){const L=get("ru_log",{}),E=get("ru_err",{});const ds=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d.toLocaleDateString("sv"))}let tn=0,to=0;Object.values(L).forEach(v=>{tn+=v.n;to+=v.ok});const bars=ds.map((k,i)=>{const v=L[k]||{ok:0,n:0},p=v.n?Math.round(100*v.ok/v.n):0,x=14+i*44;return `<rect class="bar" x="${x}" y="${115-p}" width="30" height="${p}" rx="4"/><text class="tx" x="${x+15}" y="${109-p}" text-anchor="middle">${v.n?p+"%":""}</text><text class="tx" x="${x+15}" y="131" text-anchor="middle">${k.slice(8)}/${k.slice(5,7)}</text><text class="tx" x="${x+15}" y="145" text-anchor="middle">${v.n} ex.</text>`}).join("");const er=Object.entries(E).sort((a,b)=>b[1]-a[1]).slice(0,8);$("#m").innerHTML=`<div class="card"><h2>Réussite par jour</h2><p class="sub">7 derniers jours : % de bonnes réponses (quiz et parler).</p><svg viewBox="0 0 330 150" width="100%" role="img" aria-label="Réussite par jour"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d365"/><stop offset="1" stop-color="#c471ed"/></linearGradient></defs><line x1="8" y1="115" x2="322" y2="115" stroke="var(--line)"/>${bars}</svg></div><div class="card"><h2>Bilan</h2><p>${tn?`${tn} exercices, ${Math.round(100*to/tn)} % de réussite.`:"Aucun exercice pour l’instant. Va dans Quiz."} Jours du plan terminés : ${done.length}/7.</p></div><div class="card"><h2>Lettres où tu fais le plus d’erreurs</h2><p class="w">${er.length?er.map(x=>x[0]+low(x[0])+" ("+x[1]+")").join("  "):"Aucune erreur enregistrée."}</p></div>`}
// NOTES
function notes(){const s=star.map(c=>c+low(c)).join("  ");
$("#m").innerHTML=`<div class="card"><h2>Lettres à revoir ★</h2><p class="w">${s||"Aucune. Marque-en dans l’onglet Alphabet."}</p></div><div class="card"><h2>Mes notes</h2><p class="sub">Enregistrées automatiquement sur cet appareil.</p><textarea id="t" placeholder="Mots, astuces, pièges, questions…"></textarea></div>`;
$("#t").value=get("ru_notes","");$("#t").oninput=e=>put("ru_notes",e.target.value)}
go(0);
try{if(!speechSynthesis.getVoices().some(v=>v.lang&&v.lang.startsWith("ru")))$("#note").textContent="Les leçons audio utilisent les voix françaises et russes de ton appareil. S’il manque une voix russe, installe-la dans les réglages de synthèse vocale."}catch(e){}
